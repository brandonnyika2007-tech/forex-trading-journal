
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Trading Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Forex Trading Journal</h1>
        <p>Track. Analyse. Improve.</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>My Trading Dashboard</h2>
            <div class="stats">
                <div class="stat">
                    <h3>Total Trades</h3>
                    <p id="totalTrades">0</p>
                </div>
                <div class="stat">
                    <h3>Net Profit/Loss</h3>
                    <p id="netProfit">$0.00</p>
                </div>
            </div>
        </section>

        <section class="trade-form">
            <h2>Record a Trade</h2>

            <form id="tradeForm">
                <label>Currency Pair</label>
                <input id="pair" placeholder="EURUSD" required>

                <label>Trade Direction</label>
                <select id="direction">
                    <option>Buy</option>
                    <option>Sell</option>
                </select>

                <label>Entry Price</label>
                <input id="entry" type="number" step="any" required>

                <label>Exit Price</label>
                <input id="exit" type="number" step="any" required>

                <label>Profit or Loss ($)</label>
                <input id="pnl" type="number" step="any" required>

                <label>Trade Analysis</label>
                <textarea id="notes" placeholder="Why did I enter this trade?"></textarea>

                <button type="submit">Save Trade</button>
            </form>
        </section>

        <section class="history">
            <h2>Trade History</h2>
            <div id="tradeList"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
